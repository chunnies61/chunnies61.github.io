    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Decodes the path 404.html encoded into the query string and
      // restores the real URL before react-router mounts and reads it.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <!-- Google Analytics 4. Runs after the URL is restored above, so a direct visit to
         /about is recorded as /about. Only on the live domain, so local previews don't
         count. Page changes inside the site are picked up by GA4's enhanced measurement
         ("page changes based on browser history events"), which is on by default. -->
    <script>

        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', id);
