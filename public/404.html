<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Yichun Liu - Staff Product Designer</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages only serves static files, so a direct visit to a route
      // like /about or /case-studies/agent-desk 404s. This redirects those
      // to index.html with the intended path encoded in the query string;
      // the script in index.html decodes it and hands off to react-router.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
